<title>For Shaista ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070207}
body{display:grid;place-items:center;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
.card{position:relative;width:min(94vw,440px);height:min(94vh,820px);overflow:hidden;border-radius:28px;background:#10040b;box-shadow:0 24px 80px #000}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.54)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0002 0%,#0001 38%,#000f 100%)}
.top{position:absolute;top:25px;left:0;right:0;text-align:center;z-index:5}
.small{font-size:12px;letter-spacing:4px}.top h1{margin:7px;font-size:35px;text-shadow:0 3px 18px #000}
.lyrics{position:absolute;left:15px;right:15px;bottom:150px;min-height:135px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}
#lyric{font-size:clamp(20px,5.8vw,30px);font-weight:800;line-height:1.35;text-shadow:0 3px 18px #000;word-break:normal}
.letter{opacity:0;display:inline-block;transform:translateY(7px);transition:opacity .12s,transform .12s}
.letter.on{opacity:1;transform:none;text-shadow:0 0 14px rgba(255,180,220,.95)}
.controls{position:absolute;left:22px;right:22px;bottom:27px;z-index:6}
.track{height:5px;border-radius:8px;background:#fff4;cursor:pointer}.fill{height:100%;width:0;background:#fff;border-radius:8px}
.row{text-align:center;margin-top:15px}button{width:64px;height:64px;border:0;border-radius:50%;font-size:25px;cursor:pointer}
.time{text-align:center;font-size:11px;opacity:.75;margin-top:7px}
.heart{position:absolute;left:50%;bottom:37%;font-size:29px;opacity:0;z-index:3;pointer-events:none}
.fly{animation:fly 4.2s linear forwards}@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.5)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),-370px) scale(1.6)}}
</style></head>

const a=document.getElementById('audio'),p=document.getElementById('play'),l=document.getElementById('lyric');
const fill=document.getElementById('fill'),track=document.getElementById('track'),now=document.getElementById('now'),dur=document.getElementById('dur');
let idx=-1, timer=null;

function fmt(x){x=Math.max(0,Math.floor(x||0));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function showLine(i){
  if(timer) clearTimeout(timer);
  if(i<0)return;
  const text=cues[i][1];
  // Preserve spaces while revealing individual characters.
  l.innerHTML=[...text].map(ch=>ch===' '?'<span class="space"> </span>':'<span class="letter">'+esc(ch)+'</span>').join('');
  const letters=[...l.querySelectorAll('.letter')];
  const next=(i+1<cues.length)?cues[i+1][0]:(audio.duration||337);
  const lineTime=Math.max(.8,next-cues[i][0]);
  // Reveal each character across the available line interval, ending just before the next cue.
  const gap=Math.max(.035,Math.min(.105,(lineTime-.22)/Math.max(1,letters.length)));
  let n=0;
  function reveal(){
    if(n>=letters.length)return;
    letters[n++].classList.add('on');
    timer=setTimeout(reveal,gap*1000);
  }
  reveal();
}

function update(){
  now.textContent=fmt(a.currentTime);
  if(a.duration)fill.style.width=(a.currentTime/a.duration*100)+'%';
  let i=-1;
  for(let n=0;n<cues.length;n++){if(cues[n][0]<=a.currentTime)i=n;else break}
  if(i!==idx){idx=i;showLine(i)}
}

p.onclick=async()=>{
  if(a.paused){
    try{await a.play();p.textContent='❚❚'}
    catch(e){alert('Audio load nahi hua. GitHub Pages par MP3 public honi chahiye.')}
  }else{a.pause();p.textContent='▶'}
};
a.addEventListener('timeupdate',update);
a.addEventListener('loadedmetadata',()=>dur.textContent=fmt(a.duration));
a.addEventListener('ended',()=>{if(timer)clearTimeout(timer);p.textContent='▶';idx=-1;l.textContent='Press ▶ to start'});
track.onclick=e=>{if(!a.duration)return;const r=track.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration;update()};
