<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>❤️ A Little Surprise ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#160b25;color:#fff}body{display:grid;place-items:center}.scene{position:relative;width:100%;height:100%;max-width:600px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#63317d 0,#29133d 45%,#100817 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#fff 1px,transparent 1px);background-size:73px 73px,109px 109px;background-position:10px 20px,40px 70px;opacity:.25;animation:twinkle 3s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.5}}
.title{position:absolute;top:7%;left:0;right:0;text-align:center;font-size:clamp(24px,7vw,38px);font-weight:900;text-shadow:0 4px 18px #0008;z-index:20}.sub{position:absolute;top:14%;left:0;right:0;text-align:center;font-size:15px;opacity:.85;z-index:20}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:30}.heart{position:absolute;bottom:-50px;font-size:22px;animation:float 7s linear forwards;filter:drop-shadow(0 0 8px #ff79b7)}@keyframes float{0%{transform:translateY(0) scale(.7) rotate(-10deg);opacity:0}12%{opacity:1}50%{transform:translateY(-48vh) scale(1.15) rotate(12deg)}100%{transform:translateY(-112vh) scale(.8) rotate(-12deg);opacity:0}}
.ground{position:absolute;bottom:-7%;left:-10%;width:120%;height:30%;border-radius:50% 50% 0 0;background:linear-gradient(#35134d,#1b0c2a);box-shadow:0 -20px 60px #ff4f9b22}
.couple{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:290px;height:270px;z-index:10}.person{position:absolute;bottom:0;width:105px;height:220px}.p1{left:18px}.p2{right:18px}.head{position:absolute;top:15px;left:14px;width:78px;height:78px;border-radius:50%;background:#ffd0b5;border:4px solid #24102e;z-index:4}.hair{position:absolute;top:-8px;left:-3px;width:84px;height:45px;border-radius:50% 50% 35% 35%;background:#26152e;z-index:5}.eye{position:absolute;top:35px;width:8px;height:10px;border-radius:50%;background:#24102e}.eye.l{left:21px}.eye.r{right:21px}.mouth{position:absolute;left:32px;top:54px;width:22px;height:10px;border-bottom:4px solid #b34d68;border-radius:50%}.body{position:absolute;top:90px;left:3px;width:100px;height:115px;border-radius:38px 38px 18px 18px;background:#ff5e9b;border:4px solid #24102e}.p2 .body{background:#7d6cff}.leg{position:absolute;bottom:0;width:30px;height:70px;background:#251332;border-radius:15px}.leg.l{left:18px}.leg.r{right:18px}.arm{position:absolute;top:103px;width:25px;height:88px;background:#ffd0b5;border:4px solid #24102e;border-radius:18px;transform-origin:top center;z-index:2}.arm.l{left:-11px;transform:rotate(28deg)}.arm.r{right:-11px;transform:rotate(-28deg)}
.p2 .hair{background:#3a1b24;height:50px}.p2 .head:after{content:'';position:absolute;top:20px;left:-9px;width:95px;height:55px;border-radius:45%;border-left:10px solid #3a1b24;border-right:10px solid #3a1b24;z-index:-1}.p2 .arm.l{transform:rotate(35deg)}.p2 .arm.r{transform:rotate(-35deg)}
.hand{position:absolute;width:25px;height:25px;border-radius:50%;background:#ffd0b5;border:4px solid #24102e;z-index:8}.h1{left:87px;top:151px}.h2{right:87px;top:151px}
.bubble{position:absolute;left:50%;top:20%;transform:translateX(-50%) scale(0);background:#fff;color:#4b1a5e;padding:12px 18px;border-radius:22px;font-weight:800;font-size:16px;white-space:nowrap;z-index:25;box-shadow:0 8px 30px #0005}.bubble:after{content:'';position:absolute;bottom:-10px;left:50%;border:10px solid transparent;border-top-color:#fff;border-bottom:0}.bubble.show{animation:pop .9s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes pop{to{transform:translateX(-50%) scale(1)}}
.love{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) scale(0);font-size:clamp(34px,10vw,58px);font-weight:1000;text-align:center;color:#fff;text-shadow:0 0 12px #ff4f9b,0 0 35px #ff4f9b;z-index:26;white-space:nowrap}.love.show{animation:love 3.5s ease forwards}@keyframes love{0%{transform:translate(-50%,-50%) scale(0);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}82%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(.8);opacity:0}}
.button{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:50;border:0;border-radius:999px;padding:15px 25px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff4f9b,#9b63ff);box-shadow:0 10px 35px #ff4f9b55;cursor:pointer}.button.hide{display:none}.timer{position:absolute;right:12px;top:12px;font-size:12px;opacity:.5;z-index:50}
.kiss{position:absolute;left:50%;bottom:32%;font-size:36px;transform:translateX(-50%);opacity:0;z-index:15}.kiss.go{animation:kiss 2.8s ease forwards}@keyframes kiss{0%{opacity:0;transform:translateX(-50%) scale(.5)}25%{opacity:1}55%{transform:translateX(-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-45px) scale(1.8)}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="stars"></div><div class="title">A Little Surprise 💗</div><div class="sub">Watch till the end… 👀</div>
<div class="hearts" id="hearts"></div><div class="bubble" id="bubble">😳 Oops… I have something to say!</div><div class="love" id="love">I LOVE YOU ❤️</div><div class="kiss" id="kiss">💋</div>
<div class="couple">
 <div class="person p1"><div class="head"><div class="hair"></div><i class="eye l"></i><i class="eye r"></i><div class="mouth"></div></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div>
 <div class="person p2"><div class="head"><div class="hair"></div><i class="eye l"></i><i class="eye r"></i><div class="mouth"></div></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div>
 <div class="hand h1"></div><div class="hand h2"></div>
</div><div class="ground"></div><div class="timer" id="timer">0:00 / 1:05</div>
<button class="button" id="start">💗 Start the surprise</button>
</div>
<script>
const hearts=document.getElementById('hearts'), start=document.getElementById('start'), bubble=document.getElementById('bubble'), love=document.getElementById('love'), kiss=document.getElementById('kiss'), timer=document.getElementById('timer');
let audioCtx, musicTimer, started=false, elapsed=0;
function heart(){const h=document.createElement('span');h.className='heart';h.textContent=['❤️','💗','💖','💕','💘','💓'][Math.floor(Math.random()*6)];h.style.left=Math.random()*100+'%';h.style.animationDuration=(5+Math.random()*4)+'s';h.style.fontSize=(16+Math.random()*25)+'px';hearts.appendChild(h);setTimeout(()=>h.remove(),9500)}
setInterval(()=>{if(started){heart();heart()}},900);
function tone(freq,dur,when,type='sine',gain=.035){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(gain,when+.03);g.gain.exponentialRampToValueAtTime(.001,when+dur);o.connect(g).connect(audioCtx.destination);o.start(when);o.stop(when+dur+.05)}
function music(){audioCtx=new (window.AudioContext||window.webkitAudioContext)();let t=audioCtx.currentTime+.1;const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33];let i=0;musicTimer=setInterval(()=>{const now=audioCtx.currentTime;const n=notes[i++%notes.length];tone(n,.34,now,'triangle',.025);tone(n/2,.55,now,'sine',.012);},420)}
function eventAt(sec){if(sec===3){bubble.classList.add('show')}if(sec===10){bubble.textContent='😂 Wait… why am I so nervous?';bubble.classList.remove('show');void bubble.offsetWidth;bubble.classList.add('show')}if(sec===20){bubble.textContent='🥹 Okay… serious moment!';bubble.classList.remove('show');void bubble.offsetWidth;bubble.classList.add('show')}if(sec===30){kiss.classList.add('go')}if(sec===38){love.classList.add('show')}if(sec===48){bubble.textContent='💗 You make everything feel special';bubble.classList.remove('show');void bubble.offsetWidth;bubble.classList.add('show')}if(sec===58){love.classList.remove('show');void love.offsetWidth;love.classList.add('show')}if(sec===64){bubble.textContent='❤️ The end… but not the feelings';bubble.classList.remove('show');void bubble.offsetWidth;bubble.classList.add('show')}}
start.onclick=()=>{if(started)return;started=true;start.classList.add('hide');music();for(let i=0;i<8;i++)setTimeout(heart,i*150);const iv=setInterval(()=>{elapsed++;timer.textContent=Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0')+' / 1:05';eventAt(elapsed);if(elapsed>=65){clearInterval(iv);timer.textContent='1:05 / 1:05'}},1000)};
</script></body></html>
