<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khairiyat — For You ♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:#f7eef2}
body{overflow-x:hidden}
.page{
  min-height:100vh; position:relative; display:flex; align-items:center; justify-content:center;
  padding:28px 16px; overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.72),transparent 34%),
    linear-gradient(135deg,#f8edf1,#f3e1e8);
}
.photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  object-position:center top; opacity:.72; filter:saturate(.82) brightness(1.03);
}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,245,248,.25),rgba(255,235,243,.62))}
.content{
  position:relative; z-index:3; width:min(720px,94vw); text-align:center;
  padding:42px 22px 34px; border-radius:30px;
  background:rgba(255,255,255,.30); backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 20px 60px rgba(120,60,80,.16);
}
.small{letter-spacing:.42em;text-transform:uppercase;font-size:12px;color:#80666f;margin-bottom:12px}
h1{margin:0;color:#6e3f50;font-size:clamp(34px,8vw,64px);font-weight:500}
.sub{margin:10px 0 24px;color:#866b74;font-size:15px}
.lyric{
  min-height:84px; display:flex;align-items:center;justify-content:center;
  color:#653d4b;font-size:clamp(20px,4.5vw,34px);line-height:1.3;
  transition:opacity .45s,transform .45s;
  text-shadow:0 2px 12px rgba(255,255,255,.8);
}
.lyric.fade{opacity:0;transform:translateY(8px)}
button{
  border:0;border-radius:999px;padding:13px 25px;background:#9d5e78;color:#fff;
  font-size:15px;cursor:pointer;box-shadow:0 8px 22px rgba(120,50,80,.25)
}
button:hover{filter:brightness(1.06)}
.hint{font-size:12px;color:#846d75;margin-top:12px}
.player{margin:20px auto 0;width:min(420px,100%);height:76px;border-radius:18px;overflow:hidden;opacity:.92}
.player iframe{width:100%;height:100%;border:0}
.heart{
  position:absolute; z-index:2; bottom:-80px; left:var(--x); font-size:var(--s);
  animation:float var(--d) linear var(--delay) infinite; opacity:0;
  filter:drop-shadow(0 7px 8px rgba(170,70,105,.18));
  pointer-events:none;
}
@keyframes float{
  0%{transform:translate3d(0,0,0) rotate(-10deg) scale(.8);opacity:0}
  10%{opacity:.88}
  50%{transform:translate3d(var(--drift),-55vh,0) rotate(12deg) scale(1.04)}
  100%{transform:translate3d(calc(var(--drift) * -1),-120vh,0) rotate(-8deg) scale(1.16);opacity:0}
}
.bow{position:absolute;z-index:1;color:#d78da7;font-size:56px;opacity:.4}
.b1{top:5%;left:5%}.b2{top:12%;right:7%}.b3{bottom:8%;left:4%}.b4{bottom:14%;right:4%}
@media(max-width:520px){.content{padding:30px 16px}.player{height:70px}.heart{font-size:calc(var(--s) * .82)}}
@media(prefers-reduced-motion:reduce){.heart{animation:none;display:none}.lyric{transition:none}}
</style>
</head>

<script>
const lyric = document.getElementById("lyric");
const btn = document.getElementById("play");
const iframe = document.getElementById("yt");

/* Original romantic lines are used here instead of reproducing copyrighted lyrics. */
const lines = [
  "“Bas tum ho… aur ye pal.”",
  "“Dil ko tumhari si ek roshni chahiye.”",
  "“Doori ho, phir bhi ehsaas paas rahe.”",
  "“Tumhari muskaan… meri favourite feeling.”",
  "“Kuch baatein lafzon se nahi hoti.”",
  "“Bas ek pal aur… mere saath.”"
];

let i = 0, started = false;
function nextLine(){
  lyric.classList.add("fade");
  setTimeout(()=>{
    i = (i + 1) % lines.length;
    lyric.textContent = lines[i];
    lyric.classList.remove("fade");
  },450);
}
setInterval(nextLine, 3600);

function playYouTube(){
  iframe.contentWindow.postMessage(JSON.stringify({
    event:"command",func:"playVideo",args:[]
  }),"*");
  started = true;
  btn.textContent = "♡ Song Playing…";
}
btn.addEventListener("click", playYouTube);
</script>
