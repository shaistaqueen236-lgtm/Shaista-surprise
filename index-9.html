<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaista Queen ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:radial-gradient(circle at top,#351044,#09000f 65%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}
.container{
  width:min(92vw,430px);
  text-align:center;
  position:relative;
  z-index:5;
}
.card{
  padding:22px 18px 25px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:28px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.photo{
  width:220px;
  height:280px;
  object-fit:cover;
  border-radius:22px;
  border:3px solid rgba(255,255,255,.8);
  box-shadow:0 0 30px rgba(255,90,170,.45);
  animation:float 3s ease-in-out infinite;
}
h1{
  margin-top:18px;
  font-size:34px;
  letter-spacing:1px;
  text-shadow:0 0 18px rgba(255,100,180,.8);
}
.subtitle{
  margin-top:7px;
  opacity:.9;
  font-size:15px;
}
.heart{
  font-size:42px;
  display:inline-block;
  margin-top:8px;
  animation:beat 1s infinite;
}
.controls{margin-top:16px}
button,label{
  border:0;
  border-radius:999px;
  padding:11px 16px;
  margin:4px;
  background:rgba(255,255,255,.14);
  color:white;
  cursor:pointer;
  font-size:14px;
}
button:hover,label:hover{background:rgba(255,255,255,.24)}
input{display:none}
#status{font-size:12px;opacity:.7;margin-top:7px}
.floating-heart{
  position:fixed;
  bottom:-50px;
  pointer-events:none;
  animation:rise linear forwards;
  z-index:1;
}
.spark{
  position:fixed;
  width:5px;height:5px;
  border-radius:50%;
  background:white;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.28)}
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
@keyframes rise{
  from{transform:translateY(0) scale(.7) rotate(0deg);opacity:0}
  15%{opacity:1}
  to{transform:translateY(-115vh) scale(1.35) rotate(25deg);opacity:0}
}
@keyframes twinkle{
  from{transform:scale(.5);opacity:.25}
  to{transform:scale(1.5);opacity:1}
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <img class="photo" src="shaista.jpg" alt="Shaista">
    <div class="heart">❤️</div>
    <h1>Shaista Queen</h1>
    <p class="subtitle">My favourite person ✨</p>

    <div class="controls">
      <label>
        🎵 Choose Love Song
        <input id="songInput" type="file" accept="audio/*">
      </label>
      <button id="playBtn">▶ Play</button>
      <button id="pauseBtn">⏸ Pause</button>
      <p id="status">Apni favourite song select karo ❤️</p>
    </div>
  </div>
</div>

<audio id="audio" loop></audio>

<script>
const audio = document.getElementById("audio");
const input = document.getElementById("songInput");
const status = document.getElementById("status");

input.addEventListener("change", () => {
  const file = input.files[0];
  if(!file) return;
  audio.src = URL.createObjectURL(file);
  status.textContent = "Song ready 🎵❤️";
  audio.play().catch(()=>{});
});

document.getElementById("playBtn").onclick = () => {
  if(!audio.src){
    status.textContent = "Pehle apna song select karo 🎵";
    return;
  }
  audio.play();
};
document.getElementById("pauseBtn").onclick = () => audio.pause();

function makeHeart(){
  const h=document.createElement("div");
  h.className="floating-heart";
  h.textContent=["❤️","💖","💕","💗","💘"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(18+Math.random()*28)+"px";
  h.style.animationDuration=(4+Math.random()*5)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
setInterval(makeHeart,350);

for(let i=0;i<28;i++){
  const s=document.createElement("div");
  s.className="spark";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDelay=(Math.random()*2)+"s";
  document.body.appendChild(s);
}
</script>
</body>
</html>
