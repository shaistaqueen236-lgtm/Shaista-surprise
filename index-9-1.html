<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shaista Queen ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,sans-serif;color:#fff;
  background:#050006;
}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.overlay{
  position:fixed;inset:0;z-index:1;
  background:radial-gradient(circle at 50% 35%,rgba(255,45,145,.18),transparent 45%);
}
.page{
  position:relative;z-index:3;height:100vh;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  width:min(92vw,410px);max-height:94vh;overflow:hidden;
  text-align:center;padding:22px 18px 24px;
  border:1px solid rgba(255,130,200,.45);
  border-radius:30px;
  background:linear-gradient(145deg,rgba(255,20,130,.13),rgba(10,0,15,.72));
  box-shadow:0 0 35px rgba(255,0,130,.28),inset 0 0 35px rgba(255,0,130,.06);
  backdrop-filter:blur(10px);
}
.small{font-size:14px;letter-spacing:3px;opacity:.8;text-transform:uppercase}
.title{
  margin:6px 0 0;font-size:39px;line-height:1.02;
  font-weight:800;
  text-shadow:0 0 12px #ff5bad,0 0 30px #ff147e;
}
.title span{color:#ff4da6}
.line{
  width:150px;height:3px;margin:12px auto 16px;
  border-radius:10px;background:#ff3d98;
  box-shadow:0 0 15px #ff3d98;
}
.photo{
  width:210px;height:275px;object-fit:cover;border-radius:22px;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 0 22px rgba(255,65,160,.8),0 0 55px rgba(255,0,120,.28);
  animation:float 3.2s ease-in-out infinite;
}
.heart{
  font-size:43px;margin-top:8px;
  animation:beat 1s infinite;
  filter:drop-shadow(0 0 14px #ff3e99);
}
.name{
  font-size:31px;font-weight:800;margin:2px 0;
  text-shadow:0 0 14px #ff57ad;
}
.sub{font-size:14px;opacity:.82;margin:7px 0 15px}
.play{
  border:0;border-radius:50px;padding:13px 24px;
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,#ff2f91,#b0209c);
  box-shadow:0 0 22px rgba(255,45,145,.45);
}
.hint{font-size:11px;opacity:.55;margin-top:8px}
.float{position:fixed;bottom:-60px;z-index:2;pointer-events:none;animation:rise linear forwards}
.spark{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;z-index:1;opacity:.7}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}12%{opacity:1}100%{transform:translateY(-115vh) scale(1.35) rotate(20deg);opacity:0}}
@media(max-height:700px){.photo{width:165px;height:215px}.title{font-size:31px}.name{font-size:26px}}
</style>
</head>

    <div class="heart">❤️</div>
    <div class="name">Shaista Queen 👑</div>
    <div class="sub">A little surprise, made with love 💗</div>

    <button class="play" onclick="playSong()">▶ Play Khairiyat 🎵</button>
    <div class="hint">Song file: <b>song.mp3</b> — upload it beside this HTML</div>
    <audio id="song" loop>
      <source src="song.mp3" type="audio/mpeg">
    </audio>
  </div>
</div>

<script>
const audio=document.getElementById('song');
function playSong(){
  audio.play().catch(()=>alert('GitHub repo me song.mp3 upload karo, phir Play Khairiyat dabao ❤️'));
}

// Floating hearts + sparkles
const hs=['❤️','💖','💕','💗','💘','💝'];
setInterval(()=>{
  const h=document.createElement('div');
  h.className='float';
  h.textContent=hs[Math.floor(Math.random()*hs.length)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(18+Math.random()*28)+'px';
  h.style.animationDuration=(4+Math.random()*5)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},260);

for(let i=0;i<45;i++){
  const s=document.createElement('div');
  s.className='spark';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  s.style.opacity=.25+Math.random()*.75;
  document.body.appendChild(s);
}

// Soft glowing particles in the background
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,stars=[];
function resize(){
  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize(); addEventListener('resize',resize);
for(let i=0;i<70;i++) stars.push({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:Math.random()*1.7+.3,a:Math.random(),v:Math.random()*.012+.004
});
function draw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const s of stars){
    s.a+=s.v;if(s.a>1||s.a<.15)s.v*=-1;
    ctx.globalAlpha=s.a;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
